name: sstp_client
description: >-
  Pure-Dart SSTP + PPP VPN client with TUN tunneling on Linux, Windows (Wintun)
  and macOS (utun) behind one platform-agnostic backend interface.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.6.0

dependencies:
  pointycastle: ^3.9.1
  args: ^2.5.0
  ffi: ^2.1.0

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
